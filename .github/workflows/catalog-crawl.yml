name: Catalog crawl

on:
  workflow_dispatch:
  schedule:
    # 03:00 KST. GitHub Actions cron uses UTC.
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: catalog-crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl official Subway catalog
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Crawl catalog
        id: crawl
        shell: bash
        run: |
          set +e
          mkdir -p ./.omc
          pnpm catalog:crawl -- --output ./.omc/subway-catalog.json
          exit_code=$?
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Ingest catalog changes
        id: ingest
        shell: bash
        run: |
          set +e
          if [ -f ./.omc/subway-catalog.json ]; then
            pnpm catalog:ingest -- --file ./.omc/subway-catalog.json
            exit_code=$?
          else
            echo "crawler output file is missing"
            exit_code=1
          fi
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Notify Discord
        if: always()
        shell: bash
        run: |
          pnpm catalog:notify -- \
            --file ./.omc/subway-catalog.json \
            --crawl-exit-code "${{ steps.crawl.outputs.exit_code || 1 }}" \
            --ingest-exit-code "${{ steps.ingest.outputs.exit_code || 1 }}"

      - name: Fail on crawl or ingest error
        shell: bash
        run: |
          if [ "${{ steps.crawl.outputs.exit_code }}" != "0" ] || [ "${{ steps.ingest.outputs.exit_code }}" != "0" ]; then
            exit 1
          fi
