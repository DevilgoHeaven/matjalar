# Supabase 프로젝트 설정 — supabase init 으로 생성된 파일 (수정 가능)
# 사용자가 콘솔에서 프로젝트 생성 후 supabase link --project-ref <REF> 실행 필요

project_id = "matjalar-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

# 카카오·구글 provider 는 Supabase Cloud 대시보드에서 등록 (외부 작업)
# 본 config 는 로컬 dev 만 영향, Cloud 는 대시보드 설정이 우선

[auth.email]
enable_signup = false  # v1 은 OAuth 만

[experimental]
webhooks = { enabled = true }
